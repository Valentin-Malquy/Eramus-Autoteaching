<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Erasmus Babel – apprenons nos langues</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef3f7;--ink:#12263a;--mute:#5d7184;--card:#fff;--line:#c9d6e0;--acc:#e8a200;--acc-ink:#12263a;--ok:#1f8a5b;--ko:#c2413a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a26;--ink:#eaf1f7;--mute:#95a9bb;--card:#172737;--line:#2c4257;--ok:#4cc38a;--ko:#ef7b74}}
:root[data-theme="dark"]{--bg:#0e1a26;--ink:#eaf1f7;--mute:#95a9bb;--card:#172737;--line:#2c4257;--ok:#4cc38a;--ko:#ef7b74}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.9rem;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 20px}
.pair{display:flex;gap:10px;align-items:end;margin-bottom:18px;flex-wrap:wrap}
.pair label{flex:1;min-width:130px;font-size:.85rem;color:var(--mute);display:flex;flex-direction:column;gap:4px}
select,input,button{font:inherit;color:inherit}
select,input{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.swap{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:2px solid var(--line)}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:28px 22px;min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;width:100%}
.card .lang{color:var(--mute);font-size:.9rem;margin-bottom:10px}
.card .txt{font-size:clamp(1.5rem,6vw,2.2rem);font-weight:800;line-height:1.2;letter-spacing:-.01em}
.card.back{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.card.back .lang{color:#3b3000}
.hint{color:var(--mute);font-size:.85rem;margin-top:14px}
.row{display:flex;gap:10px;margin-top:14px}
.row button,.btn{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.btn.ok{border-color:var(--ok);color:var(--ok)}.btn.ko{border-color:var(--ko);color:var(--ko)}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem;margin-bottom:10px}
.q{font-size:1.5rem;font-weight:800;margin:6px 0 14px}
.opts{display:grid;gap:10px}
.opt{padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;text-align:left;font-weight:600}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 18%,var(--card))}
.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.grid label{font-size:.85rem;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.list{margin-top:22px;display:grid;gap:8px}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:.95rem}
.item small{color:var(--mute)}
.item button{background:none;border:0;cursor:pointer;color:var(--ko);font-size:1.1rem}
.msg{margin-top:10px;color:var(--ok);font-weight:600;min-height:1.4em}
h2{font-size:1.1rem;margin:28px 0 8px}textarea{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;color:inherit;resize:vertical}
@media (prefers-reduced-motion:no-preference){.card{transition:background .2s,transform .15s}.card:active{transform:scale(.98)}}
</style>
</head>
<body>
<main>
  <h1>Erasmus Babel</h1>
  <p class="sub">Apprenons les langues de nos amis, une phrase à la fois.</p>

  <div class="pair">
    <label>Je parle <select id="from"></select></label>
    <button class="swap" id="swap" aria-label="Inverser les langues">⇄</button>
    <label>J'apprends <select id="to"></select></label>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-t="cards">Cartes</button>
    <button role="tab" aria-selected="false" data-t="quiz">Quiz</button>
    <button role="tab" aria-selected="false" data-t="add">Ajouter</button>
  </div>

  <section id="cards"></section>
  <section id="quiz" hidden></section>
  <section id="add" hidden></section>
</main>

<script>

const BASE_LANGS=[["fr","🇫🇷 Français","fr-FR"],["en","🇬🇧 English","en-GB"],["es","🇪🇸 Español","es-ES"],["de","🇩🇪 Deutsch","de-DE"],["it","🇮🇹 Italiano","it-IT"],["pt","🇵🇹 Português","pt-PT"]];
const CODES=BASE_LANGS.map(l=>l[0]);
const BASE=[
["Bonjour","Hello","Hola","Hallo","Ciao","Olá"],
["Merci","Thank you","Gracias","Danke","Grazie","Obrigado"],
["S'il te plaît","Please","Por favor","Bitte","Per favore","Por favor"],
["Je m'appelle…","My name is…","Me llamo…","Ich heiße…","Mi chiamo…","Chamo-me…"],
["Je ne comprends pas","I don't understand","No entiendo","Ich verstehe nicht","Non capisco","Não entendo"],
["Tu parles anglais ?","Do you speak English?","¿Hablas inglés?","Sprichst du Englisch?","Parli inglese?","Falas inglês?"],
["Où sont les toilettes ?","Where is the toilet?","¿Dónde está el baño?","Wo ist die Toilette?","Dov'è il bagno?","Onde fica a casa de banho?"],
["Où est la fac ?","Where is the university?","¿Dónde está la universidad?","Wo ist die Universität?","Dov'è l'università?","Onde fica a universidade?"],
["Combien ça coûte ?","How much is it?","¿Cuánto cuesta?","Wie viel kostet das?","Quanto costa?","Quanto custa?"],
["Je voudrais une bière","I would like a beer","Quisiera una cerveza","Ich möchte ein Bier","Vorrei una birra","Queria uma cerveja"],
["À la tienne !","Cheers!","¡Salud!","Prost!","Cin cin!","Saúde!"],
["On sort ce soir ?","Shall we go out tonight?","¿Salimos esta noche?","Gehen wir heute Abend aus?","Usciamo stasera?","Saímos hoje à noite?"]
].map(r=>Object.fromEntries(r.map((v,i)=>[CODES[i],v])));

const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
/* === Configuration de la base partagée (Supabase) : laisser vide = mode local === */
const SUPABASE_URL="https://uiippwjeckaymcohewdc.supabase.co";
const SUPABASE_KEY="sb_publishable_RU-McUvPKxsfp_X8ZHFIlw_Jvakkcmi";
const REMOTE=!!(SUPABASE_URL&&SUPABASE_KEY);
let custom=REMOTE?[]:load("babel-words",[]);
let extra=REMOTE?[]:load("babel-langs",[]);
const saveAll=()=>{if(!REMOTE){store("babel-words",custom);store("babel-langs",extra)}};
async function api(path,opt={}){
  const h={apikey:SUPABASE_KEY,"Content-Type":"application/json",...(SUPABASE_KEY.startsWith("sb_")?{}:{Authorization:"Bearer "+SUPABASE_KEY}),...(opt.headers||{})};
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opt,headers:h});
  if(!r.ok)throw new Error(r.status);
  return opt.method==="POST"?null:r.json();
}
async function pull(){
  if(!REMOTE)return;
  const [l,w]=await Promise.all([api("languages?select=code,name,voice&order=id"),api("words?select=data&order=id")]);
  extra=l.map(x=>({c:x.code,n:x.name,v:x.voice||""}));custom=w.map(x=>x.data);
}
const post=(t,b)=>api(t,{method:"POST",body:JSON.stringify(b),headers:{Prefer:"return=minimal"}});
const langs=()=>BASE_LANGS.concat(extra.map(l=>[l.c,"🌍 "+l.n,l.v||""]));
const find=c=>langs().find(l=>l[0]===c);
const name=c=>find(c)?find(c)[1]:c;
const deck=()=>BASE.concat(custom);
const usable=()=>deck().filter(r=>r[F.value]&&r[T.value]);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const F=$("#from"),T=$("#to");
function fillSelects(){
  const f=F.value||"fr",t=T.value||"es";
  [F,T].forEach(s=>{s.innerHTML="";langs().forEach(l=>s.add(new Option(l[1],l[0])))});
  F.value=find(f)?f:"fr";T.value=find(t)?t:"es";
  if(F.value===T.value)T.value=langs().find(l=>l[0]!==F.value)[0];
}
function ensureDiff(ch){if(F.value===T.value){(ch===F?T:F).value=langs().find(l=>l[0]!==ch.value)[0]}}
F.onchange=()=>{ensureDiff(F);resetAll()};T.onchange=()=>{ensureDiff(T);resetAll()};
$("#swap").onclick=()=>{const a=F.value;F.value=T.value;T.value=a;resetAll()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["cards","quiz","add"].forEach(id=>$("#"+id).hidden=id!==b.dataset.t);
  if(b.dataset.t==="add")renderAdd();
});
function speak(text,code){
  try{const u=new SpeechSynthesisUtterance(text);const l=find(code);if(l&&l[2])u.lang=l[2];u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
const EMPTY=`<div class="card" style="cursor:default"><div class="txt">Aucune phrase pour cette paire</div><div class="hint">Ajoute des mots dans ces deux langues depuis l'onglet « Ajouter ».</div></div>`;

/* Cartes */
let ci=0,flipped=false,known=0,order=[];
function startCards(){order=shuffle(usable());ci=0;flipped=false;known=0;renderCard()}
function renderCard(){
  const el=$("#cards"),f=F.value,t=T.value;
  if(!order.length){el.innerHTML=EMPTY;return}
  if(ci>=order.length){
    el.innerHTML=`<div class="card" style="cursor:default"><div class="txt">${known} / ${order.length} sues</div><div class="hint">Série terminée, bravo !</div></div><div class="row"><button class="btn main" id="again">Rejouer</button></div>`;
    $("#again").onclick=startCards;return;
  }
  const r=order[ci];
  el.innerHTML=`<div class="stat"><span>Carte ${ci+1} / ${order.length}</span><span>${known} sues</span></div>
  <button class="card ${flipped?"back":""}" id="card"><span class="lang">${esc(name(flipped?t:f))}</span><span class="txt">${esc(r[flipped?t:f])}</span></button>
  <div class="hint">${flipped?"":"Touche la carte pour voir la traduction"}</div>
  <div class="row">${flipped?`<button class="btn" id="hear">🔊 Écouter</button><button class="btn ko" id="no">À revoir</button><button class="btn ok" id="yes">Je sais</button>`:`<button class="btn" id="hear">🔊 Écouter</button>`}</div>`;
  $("#card").onclick=()=>{flipped=!flipped;if(flipped)speak(r[t],t);renderCard()};
  $("#hear").onclick=()=>speak(r[flipped?t:f],flipped?t:f);
  if(flipped){
    $("#yes").onclick=()=>{known++;ci++;flipped=false;renderCard()};
    $("#no").onclick=()=>{order.push(r);ci++;flipped=false;renderCard()};
  }
}

/* Quiz */
let qn=0,qs=0,qOrder=[];
function startQuiz(){qOrder=shuffle(usable()).slice(0,10);qn=0;qs=0;renderQ()}
function renderQ(){
  const el=$("#quiz"),f=F.value,t=T.value;
  if(!qOrder.length){el.innerHTML=EMPTY;return}
  if(qn>=qOrder.length){
    el.innerHTML=`<div class="card" style="cursor:default"><div class="txt">${qs} / ${qOrder.length}</div><div class="hint">${qs>=qOrder.length*.8?"Impressionnant !":"Encore un tour pour progresser ?"}</div></div><div class="row"><button class="btn main" id="rq">Nouveau quiz</button></div>`;
    $("#rq").onclick=startQuiz;return;
  }
  const r=qOrder[qn],pool=usable().filter(x=>x[t]!==r[t]);
  const opts=shuffle([r].concat(shuffle(pool).slice(0,3)));
  el.innerHTML=`<div class="stat"><span>Question ${qn+1} / ${qOrder.length}</span><span>Score : ${qs}</span></div>
  <div class="hint">Comment dit-on en ${esc(name(t))} :</div><div class="q">${esc(r[f])}</div>
  <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o[t])}</button>`).join("")}</div>
  <div class="row" id="nx" hidden><button class="btn main" id="next">Suivant</button></div>`;
  const bs=[...el.querySelectorAll(".opt")];
  bs.forEach((b,i)=>b.onclick=()=>{
    if(opts[i]===r)qs++;
    bs.forEach((x,j)=>{x.disabled=true;if(opts[j]===r)x.classList.add("good");else if(j===i)x.classList.add("bad")});
    speak(r[t],t);$("#nx").hidden=false;$("#next").focus();
    $("#next").onclick=()=>{qn++;renderQ()};
  });
}

/* Ajouter */
function say(id,txt,ok=true){const m=$("#"+id);m.style.color=ok?"var(--ok)":"var(--ko)";m.textContent=txt}
function renderAdd(){
  const el=$("#add");
  el.innerHTML=`<h2>Ajouter un mot ou une phrase</h2>
  <p class="sub">Renseigne au moins deux langues.</p>
  <div class="grid">${langs().map(l=>`<label>${esc(l[1])}<input data-c="${esc(l[0])}" autocomplete="off"></label>`).join("")}</div>
  <div class="row"><button class="btn main" id="saveW">Ajouter ce mot</button></div><div class="msg" id="m1" role="status"></div>

  <h2>Ajouter une langue</h2>
  <div class="grid"><label>Nom de la langue<input id="ln" placeholder="Roumain" autocomplete="off"></label>
  <label>Voix (facultatif)<input id="lv" placeholder="ro-RO" autocomplete="off"></label></div>
  <div class="row"><button class="btn main" id="saveL">Ajouter cette langue</button></div><div class="msg" id="m2" role="status"></div>
  ${extra.length?`<div class="list">${extra.map((l,i)=>`<div class="item"><span>🌍 ${esc(l.n)} <small>${esc(l.v)}</small></span>${REMOTE?"":`<button data-dl="${i}" aria-label="Supprimer la langue">✕</button>`}</div>`).join("")}</div>`:""}

  <h2>Mes ajouts</h2>
  <div class="list">${custom.map((r,i)=>`<div class="item"><span>${Object.entries(r).map(([c,v])=>esc(v)).join(" · ")}</span>${REMOTE?"":`<button data-d="${i}" aria-label="Supprimer">✕</button>`}</div>`).join("")||`<small style="color:var(--mute)">Rien pour l'instant. Tes mots apparaîtront dans les cartes et le quiz.</small>`}</div>

  ${REMOTE?`<p class="sub" style="margin-top:24px">Tes ajouts sont visibles par tous tes amis.</p>`:`  <h2>Partager avec des amis</h2>
  <p class="sub">Exporte ta liste, envoie le texte à un ami, et il l'importe chez lui.</p>
  <textarea id="io" rows="4" placeholder="Colle ici une liste reçue, puis clique sur Importer"></textarea>
  <div class="row"><button class="btn" id="exp">Exporter</button><button class="btn main" id="imp">Importer</button></div><div class="msg" id="m3" role="status"></div>`}`;

  $("#saveW").onclick=async()=>{
    const row={};el.querySelectorAll("[data-c]").forEach(i=>{if(i.value.trim())row[i.dataset.c]=i.value.trim()});
    if(Object.keys(row).length<2)return say("m1","Remplis au moins deux langues.",false);
    try{if(REMOTE){await post("words",{data:row});await pull()}else{custom.push(row);saveAll()}}catch(e){return say("m1","Erreur de connexion, réessaie.",false)}
    renderAdd();say("m1","Ajouté !");resetAll();
  };
  $("#saveL").onclick=async()=>{
    const n=$("#ln").value.trim(),v=$("#lv").value.trim();
    if(!n)return say("m2","Écris le nom de la langue.",false);
    const c="x_"+n.toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g,"");
    if(find(c)||langs().some(l=>l[1].slice(3).toLowerCase()===n.toLowerCase()))return say("m2","Cette langue existe déjà.",false);
    try{if(REMOTE){await post("languages",{code:c,name:n,voice:v});await pull()}else{extra.push({c,n,v});saveAll()}}catch(e){return say("m2","Erreur : langue déjà ajoutée ou connexion perdue.",false)}
    fillSelects();renderAdd();say("m2","Langue ajoutée !");resetAll();
  };
  el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{custom.splice(+b.dataset.d,1);saveAll();renderAdd();resetAll()});
  el.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>{extra.splice(+b.dataset.dl,1);saveAll();fillSelects();renderAdd();resetAll()});
  if(!REMOTE)$("#exp").onclick=()=>{$("#io").value=JSON.stringify({langs:extra,words:custom});$("#io").select();say("m3","Copie ce texte et envoie-le à tes amis.")};
  if(!REMOTE)$("#imp").onclick=()=>{
    try{
      const d=JSON.parse($("#io").value);let nl=0,nw=0;
      (d.langs||[]).forEach(l=>{if(l&&l.c&&l.n&&!find(l.c)){extra.push({c:String(l.c),n:String(l.n),v:String(l.v||"")});nl++}});
      (d.words||[]).forEach(w=>{if(w&&typeof w==="object"&&!custom.some(x=>JSON.stringify(x)===JSON.stringify(w))){custom.push(w);nw++}});
      saveAll();fillSelects();renderAdd();say("m3",`Importé : ${nl} langue(s), ${nw} mot(s).`);resetAll();
    }catch(e){say("m3","Ce texte n'est pas une liste valide.",false)}
  };
}
function resetAll(){startCards();startQuiz()}
fillSelects();resetAll();
if(REMOTE)pull().then(()=>{fillSelects();resetAll()}).catch(()=>{});
</script>
</body>
</html>
